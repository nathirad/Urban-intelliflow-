<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Urban IntelliFlow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F5A48"/>
      <stop offset="100%" stop-color="#103029"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7CE86"/>
      <stop offset="55%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9C7E33"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" stroke="#C9A84C" stroke-width="6"/>

  <!-- city skyline (gold outline) -->
  <g fill="none" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <path d="M150 214 V150 h34 V214"/>
    <path d="M196 214 V112 h40 V214"/>
    <path d="M248 214 V96 l24 -26 24 26 V214"/>
    <path d="M308 214 V124 h40 V214"/>
    <path d="M360 214 V158 h34 V214"/>
  </g>
  <!-- window dots -->
  <g fill="url(#gold)">
    <circle cx="213" cy="150" r="5"/><circle cx="213" cy="178" r="5"/>
    <circle cx="268" cy="150" r="5"/><circle cx="268" cy="186" r="5"/>
    <circle cx="328" cy="158" r="5"/><circle cx="328" cy="186" r="5"/>
  </g>

  <!-- traffic light housing -->
  <rect x="226" y="214" width="60" height="132" rx="30" fill="#0C2620" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="256" cy="244" r="15" fill="#D34A3D"/>
  <circle cx="256" cy="280" r="15" fill="#E6B23C"/>
  <circle cx="256" cy="316" r="15" fill="#3FBF86"/>

  <!-- flowing arrows sweeping left to right -->
  <g fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round">
    <path d="M120 268 C 170 268, 196 268, 222 268"/>
    <path d="M120 300 C 176 300, 196 300, 222 308"/>
    <path d="M290 268 C 330 250, 360 250, 392 250"/>
    <path d="M290 300 C 338 312, 360 318, 392 326"/>
  </g>
  <g fill="url(#gold)">
    <path d="M392 250 l-22 -12 v24 z"/>
    <path d="M392 326 l-22 -12 v24 z"/>
    <path d="M170 268 l-22 -12 v24 z" opacity="0.9"/>
  </g>

  <!-- road dashes -->
  <line x1="120" y1="392" x2="392" y2="392" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 34"/>
  <line x1="120" y1="392" x2="392" y2="392" stroke="#3FBF86" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 36" opacity="0.5"/>
</svg>
